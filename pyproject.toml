[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magpie-x"
version = "0.1.0"
description = "Research-grade pathogenicity prediction for human exonic nonsynonymous variants."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MAGPIE_X Contributors" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

